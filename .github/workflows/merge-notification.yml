name: Discord Release Notes

on:
  pull_request:
    types: [closed]
    branches: [main, master]
  workflow_dispatch:
    # Allow manual triggering for debugging or re-runs

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  release-notes:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull request title
        id: pr
        uses: actions/github-script@v7
        with:
          script: return context.payload.pull_request.title
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}

      - name: Send Release Notes to Discord
        uses: alienindisgui-se/discord-changelog-notifier@afd24716afd11e8c21410ea29702cf4c2528eb51
        with:
          github_token: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
          discord_webhook: ${{ secrets.NOTIFICATION_DISCORD_WEBHOOK }}
          ai_api_key: ${{ secrets.GEMINI_API_KEY }}
          language: 'sv'
